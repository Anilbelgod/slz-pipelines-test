steps:
  - id: 'terraform init'
    name: "hashicorp/terraform:1.2.9"
    entrypoint: 'sh'
    dir: $_APPLICATION_DIRECTORY
    args:
    - '-c'
    - |
      terraform init 


  - id: 'TF Plan'
    name: "hashicorp/terraform:1.2.9"
    entrypoint: 'sh'
    dir: $_APPLICATION_DIRECTORY
    args:
    - '-c'
    - |    
       terraform plan 

  - id: 'TF Apply'
    name: $_TF_IMAGE
    entrypoint: 'sh'
    dir: $_APPLICATION_DIRECTORY
    args:
    - '-c'
    - |      
      terraform apply 