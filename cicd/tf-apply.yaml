steps:
  - name: hashicorp/terraform:1.6
    id: 'Terraform Init'
    entrypoint: 'bash'
    dir: "bootstrap"
    args:
      - '-c'
      - |
          terraform init

  - name: hashicorp/terraform:1.6
    id: 'Terraform Plan'
    entrypoint: 'sh'
    dir: "bootstrap"
    args:
      - '-c'
      - |
         terraform plan
  - name: hashicorp/terraform:1.6
    id: 'Terraform Apply'
    entrypoint: 'sh'
    dir: "bootstrap"
    args:
      - '-c'
      - |
         terraform apply


  logsBucket: 'gs://bkt-cb-log-bkt'
options:
 logging: GCS_ONLY