name: tf-prod-workflow-apply
steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud builds submit --config=cicd/tf-apply-template.yaml
options:
  logging: CLOUD_LOGGING_ONLY  # Valid logging setting

ssubstitutions:
  _APPLICATION_DIRECTORY: "bootstrap"
  _TF_IMAGE: "hashicorp/terraform:1.2.9"

timeout: "1200s"