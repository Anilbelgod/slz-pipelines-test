steps:
  - id: 'branch'
    name: 'alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
          echo "*********************"
          echo "$BRANCH_NAME"
          echo "*********************"

  - id: 'tf-init'
    name: 'hashicorp/terraform:1.0.0'
    entrypoint: 'sh'
    dir: "bootstrap"
    args:
      - '-c'
      - |
          terraform init

  - id: 'tf-plan'
    name: 'hashicorp/terraform:1.0.0'
    entrypoint: 'sh'
    dir: "bootstrap"
    args:
      - '-c'
      - |
          terraform plan

  - id: 'tf-apply'
    name: 'hashicorp/terraform:1.0.0'
    entrypoint: 'sh'
    dir: "bootstrap"
    args:
      - '-c'
      - |
          terraform apply -auto-approve
logsBucket: 'gs://bkt-cb-log-bkt'
options:
 logging: GCS_ONLY

