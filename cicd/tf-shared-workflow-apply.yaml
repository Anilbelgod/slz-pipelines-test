steps:
  - id: 'Terraform Init'
    name: "hashicorp/terraform:1.2.9"
    entrypoint: 'sh'
    dir: "${_APPLICATION_DIRECTORY}"
    args:
      - '-c'
      - |
        echo "working directory is ${_APPLICATION_DIRECTORY}"
        terraform init
        echo "working directory is ${_APPLICATION_DIRECTORY}"

  - id: 'Terraform Plan'
    waitFor: ['-']
    name: "hashicorp/terraform:1.2.9"
    entrypoint: 'sh'
    dir: "${_APPLICATION_DIRECTORY}"
    args:
      - '-c'
      - |
        terraform plan

  # - id: 'Terraform Apply'
