steps:
  - id: 'Terraform_Init'
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: 'sh'
    dir: "${_APPLICATION_DIRECTORY}"
    args:
      - '-c'
      - |

        terraform init

  - id: 'Terraform_Plan'
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: 'sh'
    dir: "${_APPLICATION_DIRECTORY}"
    args:
      - '-c'
      - |
        terraform plan

  - id: 'Terraform_Apply'
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: 'sh'
    dir: "${_APPLICATION_DIRECTORY}"
    args:
      - '-c'
      - |
        terraform apply -auto-approve

options:
  logging: CLOUD_LOGGING_ONLY  # Valid logging setting

substitutions:
  _APPLICATION_DIRECTORY: "bootstrap/"
  _TF_IMAGE: "hashicorp/terraform:1.2.9"

timeout: "1200s"
