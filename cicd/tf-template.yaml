id: terraform-deployments

steps:
  - uses: "cicd/tf-apply.yaml"
    with:
      application_directory: "bootstrap"
      environment: "shared"
      bucket_name: "bkt-cb-log-bkt"

substitutions:
  _APPLICATION_DIRECTORY: "bootstrap"
  _ENVIRONMENT: "shared"
  _BUCKET_NAME: "bkt-cb-log-bkt"

options:
  logging: GCS_ONLY


